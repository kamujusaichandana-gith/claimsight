name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx tsc -b --pretty false
        working-directory: client
      - run: npm run build
        working-directory: client
      - run: npm test
        working-directory: client

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: claimsight_test
          POSTGRES_USER: claimsight_test
          POSTGRES_PASSWORD: claimsight_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claimsight_test -d claimsight_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://claimsight_test:claimsight_test@localhost:5432/claimsight_app?schema=public
      JWT_SECRET: ci-only-dummy-jwt-secret
      CLIENT_ORIGIN: http://localhost:5173
      LLM_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma validate
        working-directory: server
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://claimsight_test:claimsight_test@localhost:5432/claimsight_test?schema=public
