name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run lint
        working-directory: client
      - run: npx tsc -b --pretty false
        working-directory: client
      - run: npm run build
        working-directory: client
      # Tests are intentionally skipped until test suites are added.
      - if: false
        run: npm test
        working-directory: client

  server:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://claimsight:claimsight@localhost:5432/claimsight?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npx prisma validate
        working-directory: server
      - run: npx tsc --noEmit -p tsconfig.json
        working-directory: server
      - run: npm run build
        working-directory: server
      # Tests are intentionally skipped until test suites are added.
      - if: false
        run: npm test
        working-directory: server
